# Salin file ini jadi nama_profil.conf (huruf kecil, angka, _ atau -), isi nilainya.
# build.*    = field android.os.Build di dalam game
# propall.*  = system property (semua pemanggil di proses game)
# prop.*     = system property (hanya kode game; untuk prop yang dipakai driver/HAL)
# gl_* vk_*  = info GPU OpenGL ES / Vulkan. Hapus baris = pakai nilai asli HP.
build.BRAND=
build.MANUFACTURER=
build.MODEL=
build.DEVICE=
propall.ro.product.brand=
propall.ro.product.manufacturer=
propall.ro.product.model=
propall.ro.product.device=
gl_vendor=
gl_renderer=
vk_vendor_id=
vk_device_id=
vk_device_name=
