name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld zip

      - name: Cek versi tag = file VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          [ "v$(tr -d ' \n' < VERSION)" = "${GITHUB_REF_NAME}" ] || { echo "Tag ${GITHUB_REF_NAME} tidak sama dengan VERSION"; exit 1; }

      - name: Test + build
        env:
          GITHUB_REPO: ${{ github.repository }}
          AUTHOR: ${{ github.repository_owner }}
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: UGSpoof
          path: out/*

      - name: Rilis (hanya saat push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.zip
            out/update.json
          body_path: CHANGELOG.md
